<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev-Detective | GitHub Search Client</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">Dev-Detective</h1>
            <button id="mode-btn"><span>DARK</span><div id="mode-icon">🌙</div></button>
        </header>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search GitHub username..." />
            <span id="error-msg" class="hidden">No results</span>
            <button id="search-btn">Search</button>
        </div>

        <!-- Main Profile Card Component -->
        <main class="profile-card">
            <!-- Loading State Spinner -->
            <div id="loading-spinner" class="spinner hidden"></div>

            <div class="profile-content">
                <div class="profile-header">
                    <img id="profile-avatar" src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="Avatar">
                    <div class="profile-info-wrapper">
                        <div class="name-container">
                            <h2 id="profile-name">The Octocat</h2>
                            <!-- Username properly set as a clickable anchor tag -->
                            <a id="profile-username" href="#" target="_blank">@octocat</a>
                        </div>
                        <p id="profile-joined">Joined 25 Jan 2011</p>
                    </div>
                </div>

                <p id="profile-bio">
                    This profile has no bio specified. Let's build something amazing together using async JavaScript and the Fetch API.
                </p>

                <!-- Phase 2: Top Repositories Section -->
                <section class="repos-section">
                    <h3>Top Repositories</h3>
                    <ul id="repos-list">
                        <li class="repo-item text-muted">No repositories loaded yet.</li>
                    </ul>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
